<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combine · Planner</title>
  <link rel="stylesheet" href="style.css?v=61">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
  <script defer src="dayflow-config.js"></script>
  <script defer src="planner-sync.js?v=9"></script>
  <script defer src="app.js?v=62"></script>
</head>
<body>
  <div id="notice" class="sr-only" role="status"></div>
  <main>
    <aside id="standalone-panel" aria-label="Standalone tasks">
      <form id="add-task" class="inline">
        <input name="title" aria-label="Task name" enterkeyhint="go" autofocus required maxlength="180">
      </form>
      <div id="standalone-tasks"></div>
    </aside>
    <section class="calendar" aria-labelledby="calendar-title">
      <div id="dictation-status" class="sr-only" role="status"></div>
      <div class="navigation">
        <div class="project-navigation">
          <form id="add-project" class="inline">
            <input name="title" aria-label="Project name" enterkeyhint="go" required maxlength="180">
          </form>
          <div class="views" role="group" aria-label="Calendar view">
            <button id="days" aria-pressed="true">Gantt</button>
            <button id="hours" aria-pressed="false">Times</button>
          </div>
          <div id="date-navigation">
            <button id="previous" type="button" aria-label="Previous day">←</button>
            <button id="next" type="button" aria-label="Next day">→</button>
          </div>
          <button id="toggle-standalone-panel" type="button" aria-controls="standalone-panel" aria-expanded="true" aria-label="Hide standalone tasks">‹</button>
          <select id="project-filter" aria-label="Filter Gantt chart by project">
            <option value="">All projects</option>
          </select>
        </div>
        <div class="date-control">
          <h1 id="calendar-title"></h1>
          <label><span class="sr-only">Jump to date</span><input id="date-picker" type="date"></label>
        </div>
        <select id="planner-actions" aria-label="Planner actions">
          <option value="" disabled selected>Actions</option>
          <option value="today">Today</option>
          <option value="collapse">Collapse</option>
          <option value="expand">Expand</option>
          <option value="five-days">5 Days</option>
          <option value="unassigned">Unassigned</option>
          <option value="sort">Sort Projects</option>
        </select>
        <div class="account-controls">
          <div class="inline">
            <button id="today">Today</button>
            <span id="sync-status" role="status">On this device</span>
          </div>
          <button id="account-settings" type="button">Account</button>
          <button id="dayflow-settings" type="button">DayFlow</button>
        </div>
      </div>
      <div class="calendar-content">
        <div id="calendar-body"></div>
      </div>
    </section>
  </main>
  <dialog id="editor" aria-labelledby="edit-title">
    <div id="editor-dictation-status" class="sr-only" role="status"></div>
    <form id="edit-form">
      <h2 id="edit-title"></h2>
      <div class="editor-content">
        <div>
          <label id="name-field">Name<input name="title" maxlength="180" required></label>
          <label id="date-field"><span id="date-label">Date</span><input name="date" type="date"></label>
          <label id="end-date-field" hidden>End date <small>(optional)</small><input name="endDate" type="date"></label>
          <label id="time-field">Time <small>(optional)</small><input name="time" type="time"></label>
          <fieldset id="description-field" hidden>
            <legend>Description</legend>
            <div id="description-toolbar" class="inline" role="group" aria-label="Description formatting"></div>
            <div id="task-description" class="note-editor" contenteditable="true" role="textbox" aria-label="Description" aria-multiline="true"></div>
          </fieldset>
          <fieldset id="notes-field">
            <legend id="notes-label">Notes</legend>
            <div id="notes-toolbar" class="inline" role="group" aria-label="Text formatting">
              <button type="button" data-command="bold" aria-label="Bold"><b>B</b></button>
              <button type="button" data-command="italic" aria-label="Italic"><i>I</i></button>
              <button type="button" data-command="underline" aria-label="Underline"><u>U</u></button>
              <button type="button" data-command="insertUnorderedList">Bullets</button>
              <button type="button" data-command="insertOrderedList">Numbered list</button>
              <button type="button" data-command="dateStamp">Date stamp</button>
            </div>
            <div id="notes"></div>
            <button id="add-note" type="button">Add note</button>
          </fieldset>
        </div>
        <fieldset id="task-links-field" hidden>
          <legend>Links</legend>
          <ul id="task-links" aria-label="Saved links"></ul>
          <label>Link name<input id="task-link-name" maxlength="120"></label>
          <label>URL<input id="task-link-url" inputmode="url"></label>
          <button type="button" id="add-task-link">Add link</button>
        </fieldset>
      </div>
      <div class="dialog-actions">
        <button type="button" id="remove" class="danger">Delete</button>
        <button type="button" id="unschedule" hidden>Unschedule</button>
        <button type="button" id="toggle-project-tasks" hidden>Hide tasks</button>
        <button type="button" id="cancel-edit" data-close>Cancel</button>
        <button id="save-edit" class="primary">Save</button>
        <button type="button" id="done-task" class="primary" hidden>Done</button>
      </div>
    </form>
  </dialog>
  <dialog id="account-dialog" aria-labelledby="account-title">
    <h2 id="account-title">Account</h2>
    <p id="account-status" role="status"></p>
    <form id="connect-form">
      <label>DayFlow email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary">Sign in</button>
    </form>
    <div id="connected" class="inline" hidden>
      <button id="import-local" hidden>Import tasks from this browser</button>
      <button id="disconnect">Sign out</button>
    </div>
    <div class="dialog-actions"><button type="button" data-close>Done</button></div>
  </dialog>
  <dialog id="dayflow-dialog">
    <h2>DayFlow</h2>
    <p id="dayflow-status" role="status"></p>
    <button id="dayflow-account" type="button">Sign in to DayFlow</button>
    <button id="refresh" type="button" hidden>Refresh</button>
    <hr>
    <label>Import a DayFlow backup<input id="import" type="file" accept=".json,application/json"></label>
    <p id="import-status" role="status"></p>
    <div class="dialog-actions"><button type="button" id="clear-import" class="danger" hidden>Clear backup</button><button type="button" data-close>Done</button></div>
  </dialog>
</body>
</html>
